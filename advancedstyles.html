<!DOCTYPE html>
<html>
	<head>
		<title>Advanced Text Styling</title>

		<style>
			body{
			font-family: Arial;
			}

			/* 10 different styles */

			.style1{
			color:red;
			text-decoration: underline;
			}

			.style2{
			color:blue;
			font-weight:bold;
			letter-spacing:5px;
			}

			.style3{
			font-style:italic;
			text-transform:uppercase;
			}

			.style4{
			text-shadow:2px 2px 5px gray;
			}

			.style5{
			word-spacing:15px;
			}

			.style6{
			text-decoration: line-through;
			color:green;
			}

			.style7{
			text-transform:capitalize;
			letter-spacing:3px;
			}

			.style8{
			font-weight:900;
			text-shadow:1px 1px 3px black;
			}

			.style9{
			text-decoration: overline;
			color:purple;
			}

			.style10{
			font-style:italic;
			font-weight:bold;
			text-shadow:3px 3px 6px black;
			}
		</style>

	</head>

		<body>

			<p class="style1">Chris Atanassov</p>
			<p class="style2">Chris Atanassov</p>
			<p class="style3">Chris Atanassov</p>
			<p class="style4">Chris Atanassov</p>
			<p class="style5">Chris Atanassov</p>
			<p class="style6">Chris Atanassov</p>
			<p class="style7">Chris Atanassov</p>
			<p class="style8">Chris Atanassov</p>
			<p class="style9">Chris Atanassov</p>
			<p class="style10">Chris Atanassov</p>

		</body>
</html>
