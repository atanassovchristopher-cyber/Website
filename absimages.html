<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit 5 Image Layout</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* Relative images container */
        .relative-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }

        .relative-container img {
            position: relative; /* relative positioning */
            margin: 5px;
            width: 150px;
            height: 100px;
        }

        /* Absolute images container */
        .absolute-container {
            position: relative; /* parent relative for absolute children */
            width: 100%;
            height: 600px; /* adjust for screen fill */
        }

        .absolute-container img {
            position: absolute; /* absolute positioning */
            width: 150px;
            height: 100px;
        }

        /* Example absolute positions */
        .abs1 { top: 10px; left: 10px; }
        .abs2 { top: 10px; right: 10px; }
        .abs3 { top: 150px; left: 50px; }
        .abs4 { top: 150px; right: 50px; }
        .abs5 { top: 300px; left: 100px; }
        .abs6 { top: 300px; right: 100px; }
        .abs7 { bottom: 10px; left: 20px; }
        .abs8 { bottom: 10px; right: 20px; }
        .abs9 { bottom: 150px; left: 200px; }
        .abs10 { bottom: 150px; right: 200px; }
    </style>
</head>
<body>

    <h2 style="text-align:center;">Relative Images</h2>
    <div class="relative-container">
        <img src="https://via.placeholder.com/150x100?text=1" alt="Rel 1">
        <img src="https://via.placeholder.com/150x100?text=2" alt="Rel 2">
        <img src="https://via.placeholder.com/150x100?text=3" alt="Rel 3">
        <img src="https://via.placeholder.com/150x100?text=4" alt="Rel 4">
        <img src="https://via.placeholder.com/150x100?text=5" alt="Rel 5">
        <img src="https://via.placeholder.com/150x100?text=6" alt="Rel 6">
        <img src="https://via.placeholder.com/150x100?text=7" alt="Rel 7">
        <img src="https://via.placeholder.com/150x100?text=8" alt="Rel 8">
        <img src="https://via.placeholder.com/150x100?text=9" alt="Rel 9">
        <img src="https://via.placeholder.com/150x100?text=10" alt="Rel 10">
    </div>

    <h2 style="text-align:center;">Absolute Images</h2>
    <div class="absolute-container">
        <img src="https://via.placeholder.com/150x100?text=11" class="abs1" alt="Abs 1">
        <img src="https://via.placeholder.com/150x100?text=12" class="abs2" alt="Abs 2">
        <img src="https://via.placeholder.com/150x100?text=13" class="abs3" alt="Abs 3">
        <img src="https://via.placeholder.com/150x100?text=14" class="abs4" alt="Abs 4">
        <img src="https://via.placeholder.com/150x100?text=15" class="abs5" alt="Abs 5">
        <img src="https://via.placeholder.com/150x100?text=16" class="abs6" alt="Abs 6">
        <img src="https://via.placeholder.com/150x100?text=17" class="abs7" alt="Abs 7">
        <img src="https://via.placeholder.com/150x100?text=18" class="abs8" alt="Abs 8">
        <img src="https://via.placeholder.com/150x100?text=19" class="abs9" alt="Abs 9">
        <img src="https://via.placeholder.com/150x100?text=20" class="abs10" alt="Abs 10">
    </div>

</body>
</html>
