<!DOCTYPE html>
<html>
<head>
	<title>CSS Selectors Demo</title>

	<!-- Embedded CSS -->
    <style>
        /* 1. Wildcard Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* 2. Type Selector */
        h1 {
            color: darkblue;
        }

        p {
            color: green;
        }

        /* 3. ID Selector */
        #specialText {
            color: red;
            font-weight: bold;
        }

        /* 4. Class Selector */
        .highlight {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors Example</h1>

    <p>This paragraph is styled using a type selector.</p>

    <p id="specialText">This paragraph uses an ID selector.</p>

    <p class="highlight">This paragraph uses a class selector.</p>

    <p class="highlight">This is another paragraph using the same class.</p>

</body>
</html>
